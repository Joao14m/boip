
spring.datasource.url=jdbc:postgresql://localhost:5433/boi_market
spring.datasource.username=boi_user
spring.datasource.password=boi_pass


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=public
spring.flyway.default-schema=public

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false


logging.level.org.flywaydb=DEBUG

# Set to true locally when you don't have the Firebase service account yet.
# NEVER set this to true in production.
boip.auth.bypass=false
boip.firebase.service-account=${FIREBASE_SERVICE_ACCOUNT:file:D:/BoiProject/secrets/firebase-service-account.json}
