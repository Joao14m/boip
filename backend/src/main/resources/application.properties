
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/boi_market}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:boi_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=public
spring.flyway.default-schema=public

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false


logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.security=DEBUG

boip.firebase.service-account=${FIREBASE_SERVICE_ACCOUNT:file:D:/BoiProject/secrets/firebase-service-account.json}

asaas.api-key = ${aact_ASAAS_API_KEY}
asaas.base-url = ${ASAAS_BASE_URL:https://sandbox.asaas.com/api}

app.webhook-url = ${APP_WEBHOOK_URL:https://your-tunnel-url/api/webhooks/asaas}
app.webhook-auth-token = ${APP_WEBHOOK_AUTH_TOKEN}
app.webhook-contact-email = ${APP_WEBHOOK_CONTACT_EMAIL:ageris.contato@gmail.com}

spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# Don't leak internals in error responses to clients.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false